<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>be26-js2-slutprojekt-grupp6</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dongle&family=Text+Me+One&display=swap" rel="stylesheet">
  </head>
  <body>

<header>
  <h1>Async Scrum Board</h1>

  <div class="allFormsDiv">
    <button id="newProjectBtn" class="newBtn">+ New project</button>
      <aside id="newProjectWrapper">
        <div class="newDiv">
          <span id="closeProjectBtn" class="closeBtn">&times;</span>
          <h2>Create new project</h2>
          <form id="newProjectForm">
            <label for="pName">Project name:</label>
            <input type="text" id="pName">
            <br>
            <label for="desDiv">Description:</label>
            <br>
            <textarea id="desDiv"></textarea>
            <br>
            <label for="deadline">Deadline:</label>
            <input type="date" id="deadline">
            <br>
            <label for="">Add members:</label>
            <div id="addMemberWrapper">
              <p class="memberWrapper">Isa</p>
            </div>
            <br>
            <input type="submit" value="Add Project" class="submitBtn" id="submitBtn">
          </form>
        </div>
      </aside>
    <button id="newMemberBtn" class="newBtn">+ New member</button>
      <aside id="newMemberWrapper">
        <div class="newDiv">
          <span id="closeMemberBtn" class="closeBtn">&times;</span>
          <h2>Add New Member</h2>
          <form id="newMemberForm">
            <label for="mName">Name:</label>
            <input type="text" name="mName" id="mName" required>
            <br>
            <label for="category">Category:</label>
            <br>
              <input type="radio" id="frontend" name="category" value="frontend">
              <label for="">Frontend</label>
              <br>
              <input type="radio" id="backend" name="category" value="backend">
              <label for="">Backend</label>
              <br>
              <input type="radio" id="ux" name="category" value="ux">
              <label for="">UX</label>
            <br>
            <input type="submit" value="Add Member" class="submitBtn" id="submitBtn">
          </form>
        </div>
      </aside>
  </div>

</header>

<main>
  <section class="gridSection">
    <div class="gridWrapper">
      <div class="div1">To Do:</div>
      <div class="div2">On Going:</div>
      <div class="div3">Done:</div>
      <div class="div4" id="todoDiv">4</div>
      <div class="div5" id="ongoingDiv">5</div>
      <div class="div6" id="doneDiv">6</div>
    </div>
  </section>
  <aside>
    <button class="filterBtn">Filter</button>
    <button class="filterBtn">Sort</button>
  </aside>
</main>

<footer>
  <a href="allProjects.html" class="allFooterBtn">All Projects</a>
  <a href="allMembers.html" class="allFooterBtn">All Members</a>
</footer>


    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
