<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project | Scrum Board</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <header>
      <div>
        <h1 id="projectName">Project</h1>
      </div>

      <nav aria-label="Main navigation">
        <a href="index.html" class="allBtn">Home</a>
        <a href="allProjects.html" class="allBtn">All projects</a>
      </nav>
    </header>

    <main class="project-page">
      <div class="project-layout">
        <section class="project-overview" aria-labelledby="projectDescription">
          <h2 id="projectDescription"></h2>
          <p id="projectDeadline"></p>
        </section>

        <section
          class="project-members-section"
          aria-labelledby="membersHeading"
        >
          <h2 id="membersHeading">Members</h2>
          <div id="projectMembers"></div>
        </section>

        <section
          class="create-task-section"
          aria-labelledby="createTaskHeading"
        >
          <h2 id="createTaskHeading">Create a new task</h2>

          <form id="taskForm">
            <label for="taskTitle">Title</label>
            <input
              type="text"
              id="taskTitle"
              placeholder="Enter task title"
              required
            />

            <label for="taskDescription">Description</label>
            <textarea
              id="taskDescription"
              placeholder="Describe the task"
              required
            ></textarea>

            <label for="taskCategory">Category</label>
            <select id="taskCategory" required>
              <option value="">Choose category</option>
              <option value="frontend">Frontend</option>
              <option value="backend">Backend</option>
              <option value="ux">UX</option>
            </select>

            <label for="taskMember">Assign member</label>
            <select id="taskMember">
              <option value="">Choose member</option>
            </select>

            <label for="taskPriority">Priority</label>
            <select id="taskPriority" required>
              <option value="">Choose priority</option>
              <option value="1">Low</option>
              <option value="2">Medium</option>
              <option value="3">High</option>
            </select>

            <label for="taskDeadline">Deadline</label>
            <input type="date" id="taskDeadline" required />

            <button type="submit">Create task</button>
          </form>
        </section>

        <section class="tasks-section" aria-labelledby="tasksHeading">
          <h2 id="tasksHeading">Tasks</h2>

          <div class="task-filters">
            <label for="categoryFilter">
              Filter by category
              <select id="categoryFilter">
                <option value="">All categories</option>
                <option value="frontend">Frontend</option>
                <option value="backend">Backend</option>
                <option value="ux">UX</option>
              </select>
            </label>

            <label for="memberFilter">
              Filter by member
              <select id="memberFilter">
                <option value="">All members</option>
              </select>
            </label>

            <label for="sortTasks">
              Sort by
              <select id="sortTasks">
                <option value="">Default</option>
                <option value="earliest">Deadline: earliest first</option>
                <option value="latest">Deadline: latest first</option>
                <option value="title-az">Title: A–Z</option>
                <option value="title-za">Title: Z–A</option>
              </select>
            </label>
          </div>

          <div class="task-columns">
            <section class="task-column" aria-labelledby="newTasksHeading">
              <h3 id="newTasksHeading">New</h3>
              <div id="newTasks"></div>
            </section>

            <section class="task-column" aria-labelledby="inProgressHeading">
              <h3 id="inProgressHeading">In progress</h3>
              <div id="inProgressTasks"></div>
            </section>

            <section class="task-column" aria-labelledby="completedHeading">
              <h3 id="completedHeading">Completed</h3>
              <div id="doneTasks"></div>
            </section>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/pages/project.ts"></script>
  </body>
</html>
